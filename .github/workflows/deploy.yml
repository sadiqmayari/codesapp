name: CI — Build verification

# Hostinger Cloud Apps handles the actual deployment on every push to main.
# This workflow is a build verifier: catches type errors, prerender issues,
# Prisma schema problems, etc. before Hostinger sees them.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Build & Type-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── Backend ──────────────────────────────────────────────────
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate
        env:
          DATABASE_URL: mysql://ci:ci@localhost:3306/ci_dummy

      - name: Verify Prisma schema
        working-directory: backend
        run: npx prisma validate
        env:
          DATABASE_URL: mysql://ci:ci@localhost:3306/ci_dummy

      - name: Type-check backend
        working-directory: backend
        run: npx tsc --noEmit

      - name: Run backend unit tests
        working-directory: backend
        run: npm test -- --testPathPattern="encryption" --forceExit
        env:
          NODE_ENV: test
          ENCRYPTION_KEY: ci-test-encryption-key-32chars!!

      # ── Frontend ─────────────────────────────────────────────────
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Build frontend (catches Next.js prerender errors)
        working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://apps.codentra.pk
