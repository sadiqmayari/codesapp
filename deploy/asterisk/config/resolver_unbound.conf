; Points Asterisk's unbound resolver at real DNS (instead of systemd's
; 127.0.0.53 stub). NOTE: in practice unbound still failed on wa.meta.vc in the
; container, so modules.conf noloads res_resolver_unbound entirely and pjsip
; uses the system resolver. This file is kept for reference / if unbound is
; re-enabled later.
[general]
nameserver = 1.1.1.1
nameserver = 8.8.8.8
