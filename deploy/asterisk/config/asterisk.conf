;=============================================================================
; asterisk.conf — base paths. Minimal; defaults are fine inside the container.
;=============================================================================
[directories](!)
astetcdir = /etc/asterisk
astmoddir = /usr/lib/asterisk/modules
astvarlibdir = /var/lib/asterisk
astagidir = /var/lib/asterisk/agi-bin
astspooldir = /var/spool/asterisk
astrundir = /var/run/asterisk
astlogdir = /var/log/asterisk

[options]
; Shared VPS — do not grab realtime priority.
highpriority = no
; Allow System()/curl in the dialplan (used for the CodesApp call webhook).
; If you prefer, remove the System() lines in extensions.conf and drive call
; logging purely from Meta's call_created/terminate webhooks to CodesApp.
