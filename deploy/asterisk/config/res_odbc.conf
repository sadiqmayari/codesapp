; Asterisk ODBC resource -> MariaDB `asterisk` schema (PJSIP Realtime).
; REPLACE __ASTERISK_DB_PASSWORD__ with the real value on the VPS
; (stored at asterisk/ASTERISK_DB_PASSWORD.txt — never committed).
[asterisk]
enabled => yes
dsn => asterisk-mariadb
username => asterisk
password => __ASTERISK_DB_PASSWORD__
pre-connect => yes
max_connections => 5
