; Combined wizards: realtime FIRST (per-agent endpoints agent-<co>-<user>),
; then config (the static Meta trunk + agent1 + agent-web in pjsip.conf).
; Listing a type here overrides ONLY that type's default mapping — transport,
; identify and contact keep their pjsip.conf/astdb defaults, so the Meta trunk,
; IP identify and dynamic REGISTER contacts all keep working.
[res_pjsip]
endpoint=realtime,ps_endpoints
endpoint=config,pjsip.conf,criteria=type=endpoint
auth=realtime,ps_auths
auth=config,pjsip.conf,criteria=type=auth
aor=realtime,ps_aors
aor=config,pjsip.conf,criteria=type=aor
