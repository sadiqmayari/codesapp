; unixODBC system DSN (mounted at /etc/odbc.ini).
; Server = the codesapp-mysql container's bridge IP on codesapp_internal.
; Asterisk runs network_mode:host, so it reaches the DB container by that IP.
; NOTE: pin this IP in compose if mysql is ever recreated (see asterisk README).
[asterisk-mariadb]
Description = CodesApp Asterisk realtime
Driver      = MariaDB
Server      = 172.19.0.4
Port        = 3306
Database    = asterisk
Option      = 3
