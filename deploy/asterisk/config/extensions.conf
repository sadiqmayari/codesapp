; CodesApp WhatsApp Calling dialplan.
; ${BUSINESS_NUMBER} = business number WITH + (substituted on the VPS).
; NO Answer() before Dial() — answering the Meta leg needs slin->opus transcode
; (none here) and drops the call. Just Dial the agent; audio bridges on answer.
[globals]
BUSINESS_NUMBER = ${BUSINESS_NUMBER}

;---- INBOUND: customer -> us (Meta sends here) ----
; Per-agent routing: ask the app who to ring (assigned agent + owners/admins,
; else the pool). Empty answer (nobody provisioned / old sessions) -> fall back
; to the shared endpoints so a call is never silently dropped.
[from-whatsapp]
exten = _+.,1,NoOp(Incoming WhatsApp call from ${CALLERID(num)} to ${EXTEN})
 same = n,Set(ROUTE=${CURL(${ENV(CALLS_ROUTE_URL)}?secret=${ENV(CALLS_WEBHOOK_SECRET)}&from=${CALLERID(num)}&to=${EXTEN})})
 same = n,System(curl -s -m 3 -X POST "${ENV(CALLS_WEBHOOK_URL)}" -H "X-Calls-Secret: ${ENV(CALLS_WEBHOOK_SECRET)}" -H "Content-Type: application/json" -d "{\"event\":\"call_started\",\"direction\":\"inbound\",\"from\":\"${CALLERID(num)}\",\"to\":\"${EXTEN}\",\"callId\":\"${UNIQUEID}\"}" >/dev/null 2>&1 &)
 same = n,ExecIf($["${ROUTE}" = ""]?Set(ROUTE=PJSIP/agent-web&PJSIP/agent1))
 same = n,Dial(${ROUTE},30)
 same = n,System(curl -s -m 3 -X POST "${ENV(CALLS_WEBHOOK_URL)}" -H "X-Calls-Secret: ${ENV(CALLS_WEBHOOK_SECRET)}" -H "Content-Type: application/json" -d "{\"event\":\"call_ended\",\"direction\":\"inbound\",\"from\":\"${CALLERID(num)}\",\"to\":\"${EXTEN}\",\"callId\":\"${UNIQUEID}\",\"durationSec\":${ANSWEREDTIME},\"answered\":${IF($[${ANSWEREDTIME} > 0]?true:false)}}" >/dev/null 2>&1 &)
 same = n,Hangup()
exten = _X.,1,Goto(from-whatsapp,+${EXTEN},1)

;---- OUTBOUND: agent -> customer (route to Meta) ----
[from-agent]
exten = _+.,1,NoOp(Outbound WhatsApp call to ${EXTEN} by ${CHANNEL(endpoint)})
 same = n,Set(AGENTEP=${CHANNEL(endpoint)})
 same = n,Set(CALLERID(num)=${BUSINESS_NUMBER})
 same = n,System(curl -s -m 3 -X POST "${ENV(CALLS_WEBHOOK_URL)}" -H "X-Calls-Secret: ${ENV(CALLS_WEBHOOK_SECRET)}" -H "Content-Type: application/json" -d "{\"event\":\"call_started\",\"direction\":\"outbound\",\"from\":\"${BUSINESS_NUMBER}\",\"to\":\"${EXTEN}\",\"callId\":\"${UNIQUEID}\",\"agent\":\"${AGENTEP}\"}" >/dev/null 2>&1 &)
 same = n,Dial(PJSIP/${EXTEN}@meta,45)
 same = n,System(curl -s -m 3 -X POST "${ENV(CALLS_WEBHOOK_URL)}" -H "X-Calls-Secret: ${ENV(CALLS_WEBHOOK_SECRET)}" -H "Content-Type: application/json" -d "{\"event\":\"call_ended\",\"direction\":\"outbound\",\"from\":\"${BUSINESS_NUMBER}\",\"to\":\"${EXTEN}\",\"callId\":\"${UNIQUEID}\",\"agent\":\"${AGENTEP}\",\"durationSec\":${ANSWEREDTIME},\"answered\":${IF($[${ANSWEREDTIME} > 0]?true:false)}}" >/dev/null 2>&1 &)
 same = n,Hangup()
exten = _X.,1,Goto(from-agent,+${EXTEN},1)
