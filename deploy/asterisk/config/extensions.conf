; CodesApp WhatsApp Calling dialplan — WORKING.
; ${BUSINESS_NUMBER} = business number WITH + (substituted on the VPS).
[globals]
BUSINESS_NUMBER = ${BUSINESS_NUMBER}

;---- INBOUND: customer -> us (Meta sends here) ----
; NO Answer() before Dial() — answering the Meta leg needs slin->opus transcode
; (none here) and drops the call. Just Dial the agent; audio bridges on answer.
[from-whatsapp]
exten = _+.,1,NoOp(Incoming WhatsApp call from ${CALLERID(num)})
 same = n,System(curl -s -m 3 -X POST "${ENV(CALLS_WEBHOOK_URL)}" -H "X-Calls-Secret: ${ENV(CALLS_WEBHOOK_SECRET)}" -H "Content-Type: application/json" -d "{\"event\":\"call_started\",\"direction\":\"inbound\",\"from\":\"${CALLERID(num)}\",\"callId\":\"${UNIQUEID}\"}" >/dev/null 2>&1 &)
 same = n,Dial(PJSIP/agent1,30)
 same = n,Hangup()
exten = _X.,1,Goto(from-whatsapp,+${EXTEN},1)

;---- OUTBOUND: agent -> customer (route to Meta) ----
[from-agent]
exten = _+.,1,NoOp(Outbound WhatsApp call to ${EXTEN} by ${CALLERID(num)})
 same = n,Set(CALLERID(num)=${BUSINESS_NUMBER})
 same = n,Dial(PJSIP/${EXTEN}@meta,45)
 same = n,Hangup()
exten = _X.,1,Goto(from-agent,+${EXTEN},1)
