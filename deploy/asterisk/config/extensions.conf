;=============================================================================
; extensions.conf — CodesApp WhatsApp Calling dialplan
;
; Two flows:
;   from-whatsapp : a CUSTOMER called the business number (user-initiated).
;                   Meta sends the INVITE here; we ring the agent(s).
;   from-agent    : an AGENT places an outbound call to a customer
;                   (business-initiated); we route it to Meta (wa.meta.vc).
;
; Multi-tenant: Meta appends the "Request URI user parameters" we set in the
; Meta dialog (e.g. tenant=<company_id>). Read it to pick the tenant's queue.
;=============================================================================

[globals]
BUSINESS_NUMBER = ${BUSINESS_NUMBER}

;--------------------------- INBOUND: customer -> us -------------------------
[from-whatsapp]
; ${EXTEN} is the dialled business number; the tenant param (if configured in
; the Meta dialog as tenant=<id>) arrives as a SIP URI user param — read via
; PJSIP_HEADER / the request URI. For the single-number MVP we just ring agent1.
exten = _+.,1,NoOp(Incoming WhatsApp call from ${CALLERID(num)} tenant=${SIP_HEADER(X-Tenant)})
 same = n,Answer()
 ; Notify CodesApp a call started (best-effort; see curl in Step below).
 same = n,System(curl -s -m 3 -X POST "$${CALLS_WEBHOOK_URL}" -H "X-Calls-Secret: $${CALLS_WEBHOOK_SECRET}" -H "Content-Type: application/json" -d '{"event":"call_started","direction":"inbound","from":"${CALLERID(num)}","to":"${EXTEN}","callId":"${UNIQUEID}"}' >/dev/null 2>&1 &)
 same = n,Dial(PJSIP/agent1,30)
 same = n,Hangup()

; Catch-all (numbers without +)
exten = _X.,1,Goto(from-whatsapp,+${EXTEN},1)

;--------------------------- OUTBOUND: us -> customer ------------------------
[from-agent]
; An agent dials a customer's number; route to Meta's SIP domain.
; Request URI form Meta expects: sip:+<number>@wa.meta.vc;transport=tls
exten = _+.,1,NoOp(Outbound WhatsApp call to ${EXTEN} by ${CALLERID(num)})
 same = n,Set(CALLERID(num)=${BUSINESS_NUMBER})
 same = n,Dial(PJSIP/${EXTEN}@meta,45)
 same = n,Hangup()

; Agents may dial without a leading + — normalize.
exten = _X.,1,Goto(from-agent,+${EXTEN},1)
