; unixODBC driver registration (mounted at /etc/odbcinst.ini).
; The odbc-mariadb package installs libmaodbc.so. Verify the path after the
; image build: `docker exec codesapp-asterisk find / -name 'libmaodbc.so*'`.
[MariaDB]
Description = MariaDB ODBC driver
Driver      = /usr/lib/x86_64-linux-gnu/odbc/libmaodbc.so
