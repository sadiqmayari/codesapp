;=============================================================================
; rtp.conf — RTP media port range for WhatsApp Calling.
; This range (10000-20000/udp) MUST be open on the VPS firewall and published
; by the container (see docker-compose.asterisk.yml). Mismatched/closed range
; = "call connects but no audio".
;=============================================================================
[general]
rtpstart = 10000
rtpend = 20000
; strictrtp protects against stray RTP; keep on.
strictrtp = yes
; No ICE/STUN needed for the SDES bring-up. When moving to DTLS-SRTP later,
; add a STUN server here (e.g. stundaddr = stun.l.google.com:19302) and set
; icesupport = yes.
icesupport = no
