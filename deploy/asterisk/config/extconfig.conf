; Maps PJSIP Realtime families -> the [asterisk] ODBC DSN (res_odbc.conf).
; Only endpoint/auth/aor are realtime (Asterisk READS them). Dynamic REGISTER
; contacts stay in astdb (default) so Asterisk never writes to MariaDB.
[settings]
ps_endpoints => odbc,asterisk,ps_endpoints
ps_auths     => odbc,asterisk,ps_auths
ps_aors      => odbc,asterisk,ps_aors
