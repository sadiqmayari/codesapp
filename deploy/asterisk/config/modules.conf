[modules]
autoload = yes
; Asterisk's bundled unbound resolver fails to resolve Meta's SIP domain
; (wa.meta.vc) in this container — OUTBOUND calls 503 with "Failed to perform
; async DNS resolution". Disabling it makes pjsip fall back to the SYSTEM
; resolver, which resolves wa.meta.vc fine. (Required for outbound/business-
; initiated calls.)
noload = res_resolver_unbound.so
; We use chan_pjsip; silence the deprecated chan_sip.
noload = chan_sip.so
