;=============================================================================
; pjsip.conf — CodesApp WhatsApp Business Calling (SIP) via Asterisk
;
; Placeholders (substitute on the VPS, e.g. via envsubst from ./.env, or edit
; by hand):
;   ${PUBLIC_IP}        = VPS public IPv4 (NAT external media/signalling address)
;   ${BUSINESS_NUMBER}  = normalized business WhatsApp number, +E.164 (e.g. +92300...)
;   ${META_SIP_PASSWORD}= Meta-generated SIP password (GET settings?include_sip_credentials=true)
;   ${AGENT1_SECRET}    = password for the agent softphone registration
;
; Design notes (from Meta's SIP spec):
;  - TLS mandatory on 5061; cert subject must cover sip.codentra.pk.
;  - Media = Opus + SRTP. We start with SDES (set srtp_key_exchange_protocol=SDES
;    on Meta's /settings). media_encryption=sdes below. (Switch to DTLS later.)
;  - Digest auth BOTH directions: Meta's domain is wa.meta.vc.
;  - No re-INVITE support on Meta's side.
;=============================================================================

;------------------------------- TRANSPORTS ----------------------------------
[transport-tls]
type = transport
protocol = tls
bind = 0.0.0.0:5061
cert_file = /etc/asterisk/certs/fullchain.pem
priv_key_file = /etc/asterisk/certs/privkey.pem
method = tlsv1_2
; NAT: advertise the public IP in SIP/SDP so RTP flows back to us.
external_media_address = ${PUBLIC_IP}
external_signaling_address = ${PUBLIC_IP}
; local_net lines keep container/VPS private ranges out of NAT rewriting.
local_net = 172.16.0.0/12
local_net = 10.0.0.0/8
local_net = 192.168.0.0/16

; WSS transport for the in-browser (JsSIP) agent softphone.
[transport-wss]
type = transport
protocol = wss
bind = 0.0.0.0:8089
cert_file = /etc/asterisk/certs/fullchain.pem
priv_key_file = /etc/asterisk/certs/privkey.pem

;------------------------------- META TRUNK ----------------------------------
; Endpoint representing WhatsApp/Meta. Receives USER-initiated INVITEs and is the
; target we send BUSINESS-initiated INVITEs through.

[meta]
type = endpoint
transport = transport-tls
context = from-whatsapp            ; inbound (user-initiated) dialplan entry
disallow = all
allow = opus
media_encryption = sdes            ; SRTP via SDES (matches Meta srtp_key_exchange_protocol=SDES)
media_encryption_optimistic = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
direct_media = no                  ; we bridge media (no re-INVITE; Meta has none)
dtmf_mode = rfc4733
from_user = ${BUSINESS_NUMBER}
from_domain = sip.codentra.pk      ; From domain MUST match the configured SIP server
outbound_auth = meta-auth         ; creds for business-initiated (Meta 407-challenges us)
aors = meta-aor
identify_by = ip,header

; Identify Meta's inbound INVITEs so they hit the [meta] endpoint.
; wa.meta.vc resolves to Meta's SIP servers; match by that domain/host.
[meta]
type = identify
endpoint = meta
match = wa.meta.vc

[meta-aor]
type = aor
contact = sip:wa.meta.vc;transport=tls

; Outbound auth = how WE answer Meta's 407 on business-initiated calls.
; username = normalized business number; password = Meta-generated.
[meta-auth]
type = auth
auth_type = userpass
username = ${BUSINESS_NUMBER}
password = ${META_SIP_PASSWORD}

;----------------------------- AGENT SOFTPHONES ------------------------------
; One per agent. Register from MicroSIP/Zoiper (TLS 5061) or JsSIP (WSS 8089).
; The CodesApp CallsModule will provision these dynamically later; this static
; one is for first bring-up / proof of two-way audio.

[agent1](!)                         ; template for agents
type = endpoint
transport = transport-tls
context = from-agent
disallow = all
allow = opus
allow = ulaw                        ; desk softphones that lack Opus fall back
media_encryption = sdes
media_encryption_optimistic = yes   ; browser softphones negotiate DTLS/SDES
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
direct_media = no
dtmf_mode = rfc4733

[agent1]
type = endpoint
transport = transport-tls
context = from-agent
disallow = all
allow = opus
allow = ulaw
media_encryption = sdes
media_encryption_optimistic = yes
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
auth = agent1-auth
aors = agent1-aor

[agent1-auth]
type = auth
auth_type = userpass
username = agent1
password = ${AGENT1_SECRET}

[agent1-aor]
type = aor
max_contacts = 2                    ; desk + browser simultaneously
remove_existing = yes
qualify_frequency = 30
