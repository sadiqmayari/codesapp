;=============================================================================
; pjsip.conf — CodesApp WhatsApp Business Calling (SIP) — WORKING config.
; Inbound (user-initiated) WhatsApp calls verified end-to-end with two-way audio.
;
; PLACEHOLDERS (substitute concrete values on the VPS — Asterisk does NOT expand
; ${ENV}; write real values in by hand/deploy script):
;   ${PUBLIC_IP}         VPS public IPv4 (NAT external addr) e.g. 72.62.127.176
;   ${BUSINESS_NUMBER}   business WhatsApp number WITH +, e.g. +9231...
;   ${BUSINESS_NUMBER_NOPLUS}  same number WITHOUT + (Meta's digest username)
;   ${META_SIP_PASSWORD} GET /<PHONE_ID>/settings?include_sip_credentials=true
;   ${AGENT1_SECRET}     agent softphone password
;
; HARD-WON GOTCHAS (do NOT undo):
;  - [global] endpoint_identifier_order MUST include auth_username (not default).
;  - Identify Meta by IP ranges (below): its first INVITE has no auth, so IP match
;    lets the SAME endpoint challenge AND validate (nonce context stays consistent).
;    Relying on auth_username alone makes Asterisk reject a *valid* digest.
;  - meta-auth: username has NO '+', and realm = asterisk is REQUIRED (empty realm
;    makes Asterisk validate with a different realm than it challenged with → fail).
;  - Media: Meta set to SDES + Opus. Asterisk here is Opus PASSTHROUGH ONLY (no
;    transcoder), so the agent leg MUST be Opus too — agent endpoint is opus-only.
;  - Dialplan must NOT Answer() the Meta leg before Dial() (ringback tone needs
;    slin->opus transcode, which doesn't exist → call drops). Just Dial().
;=============================================================================

[global]
type = global
endpoint_identifier_order = auth_username,username,ip,anonymous

;======================= TRANSPORTS =======================
[transport-tls]
type = transport
protocol = tls
bind = 0.0.0.0:5061
cert_file = /etc/asterisk/certs/fullchain.pem
priv_key_file = /etc/asterisk/certs/privkey.pem
method = tlsv1_2
external_media_address = ${PUBLIC_IP}
external_signaling_address = ${PUBLIC_IP}
local_net = 172.16.0.0/12
local_net = 10.0.0.0/8
local_net = 192.168.0.0/16

[transport-wss]
type = transport
protocol = wss
bind = 0.0.0.0:8089
cert_file = /etc/asterisk/certs/fullchain.pem
priv_key_file = /etc/asterisk/certs/privkey.pem

;======================= META TRUNK =======================
[meta]
type = endpoint
transport = transport-tls
context = from-whatsapp
disallow = all
allow = opus
allow = ulaw
media_encryption = sdes
media_encryption_optimistic = yes
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
direct_media = no
dtmf_mode = rfc4733
from_user = ${BUSINESS_NUMBER}
from_domain = sip.codentra.pk
outbound_auth = meta-auth-out
auth = meta-auth
identify_by = ip,auth_username,username
aors = meta-aor

; Identify Meta by Facebook/Meta IP ranges (its SIP source IPs vary).
[meta-identify]
type = identify
endpoint = meta
match = 31.13.24.0/21
match = 31.13.64.0/18
match = 45.64.40.0/22
match = 57.144.0.0/14
match = 66.220.144.0/20
match = 69.63.176.0/20
match = 69.171.224.0/19
match = 74.119.76.0/22
match = 102.132.96.0/20
match = 103.4.96.0/22
match = 129.134.0.0/16
match = 157.240.0.0/16
match = 173.252.64.0/18
match = 179.60.192.0/22
match = 185.60.216.0/22
match = 204.15.20.0/22
match = 2a03:2880::/29

[meta-aor]
type = aor
contact = sip:wa.meta.vc:5061;transport=tls

; ─────────────────────────────────────────────────────────────────────────
; AUTO-TOKEN (do NOT reintroduce a hand-edit workflow): the password here is
; the Meta System User access token, which ROTATES. These two static blocks
; are only a BOOTSTRAP/FALLBACK — the LIVE password lives in the PJSIP Realtime
; table `asterisk.ps_auths` (rows id=meta-auth, id=meta-auth-out), which
; sorcery.conf consults BEFORE config (realtime listed first → it shadows these
; blocks once populated). CodesApp's SipTrunkAuthService.syncTrunkAuth() upserts
; those rows automatically whenever the Meta token is saved (onboarding step 3,
; add/update WhatsApp number) + the manual POST /api/calls/sync-trunk-auth.
; So a rotated token takes effect with NO edit here — just repopulated realtime.
; Substitute ${META_SIP_PASSWORD} with the token current AT DEPLOY so a cold
; start before the first sync still registers; after that, realtime wins.
; (Requires backend env CALLS_BUSINESS_NUMBER = ${BUSINESS_NUMBER_NOPLUS}.)
; ─────────────────────────────────────────────────────────────────────────

; INBOUND auth (we are the server): realm MUST equal our challenge realm.
[meta-auth]
type = auth
auth_type = userpass
realm = asterisk
username = ${BUSINESS_NUMBER_NOPLUS}
password = ${META_SIP_PASSWORD}

; OUTBOUND auth (we are the client): realm MUST match Meta's 407 challenge
; realm, which is wa.meta.vc — a SEPARATE auth object (one auth = one realm).
[meta-auth-out]
type = auth
auth_type = userpass
realm = wa.meta.vc
username = ${BUSINESS_NUMBER_NOPLUS}
password = ${META_SIP_PASSWORD}

;===================== AGENT SOFTPHONE =====================
; Opus-only (Meta is Opus-only + no transcoder). The softphone MUST enable Opus.
[agent1]
type = endpoint
transport = transport-tls
context = from-agent
disallow = all
allow = opus
media_encryption = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
direct_media = no
dtmf_mode = rfc4733
auth = agent1-auth
aors = agent1

[agent1-auth]
type = auth
auth_type = userpass
username = agent1
password = ${AGENT1_SECRET}

; AOR id MUST equal the registering username (agent1) — not 'agent1-aor'.
[agent1]
type = aor
max_contacts = 2
remove_existing = yes
qualify_frequency = 30
