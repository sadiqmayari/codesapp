# CodesApp — VPS deployment stack. SEPARATE Docker project from n8n.
# Plugs into the EXISTING n8n Traefik via labels + the external `n8n_default` network.
# We never modify n8n; we only join its network so Traefik can route to us.
#
# On the VPS this lives at /docker/codesapp/ with:
#   ./app/      = extracted repo source (build context, contains the Dockerfile)
#   ./.env      = secrets (NOT committed)
#   ./storage/  = WhatsApp media (bind-mounted; rsync'd from Hostinger)

services:
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: codesapp-app:latest
    container_name: codesapp-app
    restart: always
    # Web role: HTTP + Socket.io + Next only. Jobs/schedulers run in `worker`.
    mem_limit: 1600m
    environment:
      APP_ROLE: web
      NODE_OPTIONS: --max-old-space-size=1280
      DATABASE_URL: ${DATABASE_URL_WEB}
      REDIS_URL: redis://redis:6379
    # Cap container logs so the verbose 2s poller can't slowly fill the disk.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    env_file:
      - .env
    depends_on:
      - mysql
      - redis
    volumes:
      - ./storage:/app/storage
    networks:
      - n8n_default        # shared with Traefik (external)
      - codesapp_internal  # private app <-> mysql
    # ⚠ NOTE: THIS FILE IS NOT what the live stack runs. Traefik routing for prod
    # lives in /docker/codesapp/docker-compose.yml ON THE VPS, which the deploy
    # does NOT overwrite. It uses SEPARATE per-subdomain routers (codesapp,
    # codesapp-track, codesapp-pr). To add a subdomain in prod you must edit that
    # VPS file + `docker compose up -d app` (recreate) so Traefik requests the
    # cert (TLS-ALPN-01, grey-cloud/origin). This block is kept in sync for docs.
    labels:
      - traefik.enable=true
      - traefik.docker.network=n8n_default
      - traefik.http.routers.codesapp.rule=Host(`app.srv1519870.hstgr.cloud`) || Host(`apps.codentra.pk`)
      - traefik.http.routers.codesapp.entrypoints=web,websecure
      - traefik.http.routers.codesapp.tls=true
      - traefik.http.routers.codesapp.tls.certresolver=mytlschallenge
      - traefik.http.services.codesapp.loadbalancer.server.port=3001
      # gzip/brotli-compress responses (JS/CSS/JSON/HTML) — big win over the long link.
      - traefik.http.middlewares.codesapp-compress.compress=true
      - traefik.http.routers.codesapp.middlewares=codesapp-compress
      # track. subdomain (branded order tracking) — separate router.
      - traefik.http.routers.codesapp-track.rule=Host(`track.codentra.pk`)
      - traefik.http.routers.codesapp-track.entrypoints=web,websecure
      - traefik.http.routers.codesapp-track.tls=true
      - traefik.http.routers.codesapp-track.tls.certresolver=mytlschallenge
      - traefik.http.routers.codesapp-track.service=codesapp
      - traefik.http.routers.codesapp-track.middlewares=codesapp-compress
      # pr. subdomain (influencer submission form) — separate router.
      - traefik.http.routers.codesapp-pr.rule=Host(`pr.codentra.pk`)
      - traefik.http.routers.codesapp-pr.entrypoints=web,websecure
      - traefik.http.routers.codesapp-pr.tls=true
      - traefik.http.routers.codesapp-pr.tls.certresolver=mytlschallenge
      - traefik.http.routers.codesapp-pr.service=codesapp
      - traefik.http.routers.codesapp-pr.middlewares=codesapp-compress

  # Worker role: SAME image. Runs the job-queue poller + every in-process
  # scheduler (courier sync, ad sync, Growth facts, ClickHouse mirror). No
  # Next.js, no Traefik route. Socket events reach browsers via Redis.
  worker:
    image: codesapp-app:latest
    container_name: codesapp-worker
    restart: always
    mem_limit: 1200m
    env_file:
      - .env
    environment:
      APP_ROLE: worker
      NODE_OPTIONS: --max-old-space-size=900
      DATABASE_URL: ${DATABASE_URL_WORKER}
      REDIS_URL: redis://redis:6379
    depends_on: [mysql, redis, app]
    volumes:
      - ./storage:/app/storage
    networks:
      - codesapp_internal

  # Dedicated Redis (NOT n8n's): Socket.io fan-out web<->worker + job wake-ups.
  # Internal only, memory-capped, no persistence.
  redis:
    image: redis:7-alpine
    container_name: codesapp-redis
    restart: always
    mem_limit: 192m
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    networks:
      - codesapp_internal   # private only — never n8n_default

  mysql:
    # MariaDB to match Hostinger prod exactly (its dump uses MariaDB-only
    # collations like utf8mb4_uca1400_ai_ci that MySQL 8 can't import).
    # Prisma's `mysql` provider talks to MariaDB transparently.
    image: mariadb:11.4
    container_name: codesapp-mysql
    restart: always
    mem_limit: 3g
    # Leak fix (Nov-2026): cap per-session memory, jemalloc returns freed memory
    # to the OS; app pools recycle connections (max_connection_lifetime=300).
    command:
      - "--innodb-buffer-pool-size=1G"
      - "--max-connections=60"
      - "--max-session-mem-used=671088640"
      - "--performance-schema=OFF"
    environment:
      MYSQL_DATABASE: codes_app
      MYSQL_USER: app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      LD_PRELOAD: /usr/lib/x86_64-linux-gnu/libjemalloc.so.2
    volumes:
      - codesapp_mysql:/var/lib/mysql
    networks:
      - codesapp_internal

  # pgvector-enabled Postgres = the AI knowledge store (hybrid vector + keyword
  # retrieval). ISOLATED from MariaDB, which stays the system of record. Internal
  # only (no Traefik route); the app reaches it at postgres:5432 via PGVECTOR_URL.
  # Everything AI is fail-safe: if this is down, retrieval falls back to MariaDB.
  # NOTE: the deploy script only rebuilds `app`; create/update this once with
  #   docker compose up -d postgres
  postgres:
    image: pgvector/pgvector:pg16
    container_name: codesapp-postgres
    restart: always
    mem_limit: 512m
    command:
      - "-c"
      - "shared_buffers=256MB"
    environment:
      POSTGRES_USER: codesapp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: codesapp_rag
    volumes:
      - codesapp_pgvector:/var/lib/postgresql/data
    networks:
      - codesapp_internal

  # ClickHouse = the Growth module's analytical store. A DERIVED, rebuildable
  # copy of growth_order_facts / growth_attribution / ad_insights_daily (MariaDB
  # stays the system of record). Internal only, hard-capped for the shared 8 GB
  # box, all system logs off (./clickhouse/low-memory.xml). If it is down the
  # app falls back to MariaDB automatically. Create/update once with
  #   docker compose up -d clickhouse
  # and set CLICKHOUSE_URL=http://clickhouse:8123 (+ USER/PASSWORD/DB) in .env.
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    container_name: codesapp-clickhouse
    restart: always
    mem_limit: 1536m
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    environment:
      CLICKHOUSE_DB: growth
      CLICKHOUSE_USER: codesapp
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - codesapp_clickhouse:/var/lib/clickhouse
      - ./clickhouse/low-memory.xml:/etc/clickhouse-server/config.d/low-memory.xml:ro
    networks:
      - codesapp_internal

networks:
  n8n_default:
    external: true        # the existing network Traefik + n8n already use
  codesapp_internal:
    driver: bridge

volumes:
  codesapp_mysql:
  codesapp_pgvector:
  codesapp_clickhouse:
